# Synthetic conversations. Every name, figure and exchange here was written for
# this repository. No real client data is used, and that is not a limitation of
# the example: the production system this pattern comes from handled regulated
# conversations that could not leave the firm, which is exactly why the harness
# takes content as an input rather than shipping a dataset of its own.

- id: c01_isa_full_check
  meta: {product: stocks_and_shares_isa}
  content: |
    Adviser: Before I suggest anything, can I ask what you take home each month?
    Client: About two thousand two hundred after tax.
    Adviser: And your outgoings, roughly? Rent, bills, anything you're repaying?
    Client: Rent is nine hundred, bills maybe three hundred. No debts.
    Adviser: That leaves you reasonable headroom. You mentioned wanting to put
    money aside for five years or so. A stocks and shares ISA could suit that,
    but I want to be straight with you: the value can go down as well as up and
    you could get back less than you put in. Over five years that evens out
    historically, but it isn't a promise.
    Client: That's fine, I'd rather know.
    Adviser: Our advice fee is 0.75% a year on the amount invested, so on ten
    thousand that's seventy-five pounds annually. There's a platform charge on
    top, around 0.25%.
    Client: Understood.
    Adviser: Take the paperwork home and read it. If anything is unclear, ring
    me before you sign.

- id: c02_pushy_guarantee
  meta: {product: bond}
  content: |
    Adviser: I've got something you'll want to hear about. Five year bond,
    guaranteed eight percent. Can't lose.
    Client: Eight percent guaranteed? Is that normal?
    Adviser: It's a limited tranche. I've got two left and they'll be gone by
    Friday.
    Client: I'd want to think about it. Money's a bit tight at the moment.
    Adviser: Everyone says that and then they miss out. You're not going to find
    this anywhere else.
    Client: What does it cost me?
    Adviser: Don't worry about that side of it, it all comes out of the
    provider's end. Shall I put you down for ten thousand?

- id: c03_good_but_no_fees
  meta: {product: stocks_and_shares_isa}
  content: |
    Adviser: What are you paying out each month at the moment, in total?
    Client: Around fourteen hundred all in.
    Adviser: And income?
    Client: Two thousand eight hundred.
    Adviser: Good, so there's room. For a ten year horizon I'd look at a
    diversified fund. You need to be comfortable that the value can fall,
    sometimes sharply, and in a bad year you'd see that on your statement.
    Client: How bad?
    Adviser: In 2008 a fund like this was down roughly forty percent before it
    recovered. If that would keep you awake, we should talk about something else.
    Client: No, I understand. I'm not touching it for ten years.
    Adviser: Then I think it's suitable. I'll send the illustration over today
    and we can go through it on the phone.

- id: c04_vague_risk_mention
  meta: {product: pension_transfer}
  content: |
    Adviser: You've got two old workplace pensions and you want them in one
    place.
    Client: Yes, I keep losing track of the paperwork.
    Adviser: Consolidating makes that simpler. There is some risk involved
    obviously, but the funds we use are well established.
    Client: What sort of risk?
    Adviser: Market stuff, nothing out of the ordinary. The charge is 0.4% a
    year, which is lower than what you're on now with one of them.
    Client: And my income side, do you need that?
    Adviser: Not really for a transfer, we're just moving what's already there.
    Client: Fair enough.

- id: c05_distressed_client_dismissed
  meta: {product: debt_consolidation}
  content: |
    Client: I'm sorry, I'm a bit all over the place. I've had a letter about the
    council tax and I don't know which one to deal with first.
    Adviser: Right. What's your monthly income?
    Client: It changes, I'm on shifts. Some months eleven hundred, some months
    more like eight.
    Adviser: And outgoings?
    Client: That's what I can't work out, that's why I rang.
    Adviser: I need a number to put in the form.
    Client: I know, I'm just finding this hard. I haven't slept properly.
    Adviser: As I already said, I need the figure. Shall we do this another time
    when you've got your paperwork?
    Client: No, please, I just need to know what to do about the council tax.
    Adviser: Council tax isn't something I cover. I'll send you a form and you
    can fill it in and send it back.

- id: c06_implied_safety
  meta: {product: structured_product}
  content: |
    Adviser: How much were you thinking of putting in?
    Client: Maybe twenty thousand. It's from my mother's estate.
    Adviser: There's a structured product I'd point you at. Virtually no risk
    and it's tracked the index well for six years.
    Client: So it's safe?
    Adviser: You'll definitely be better off than leaving it in a current
    account, I can tell you that much.
    Client: Are there charges?
    Adviser: We charge 1% up front, so two hundred pounds on twenty thousand.
    Client: And what's your income question, do you need that?
    Adviser: Not for a lump sum, no.

- id: c07_thorough_brusque
  meta: {product: pension_consolidation}
  content: |
    Adviser: Income please.
    Client: Three thousand one hundred a month.
    Adviser: Outgoings.
    Client: About nineteen hundred.
    Adviser: Existing debts?
    Client: A car loan, two hundred a month, eighteen months left.
    Adviser: Fine. On consolidation: your capital is at risk once it's invested,
    you can get back less than you put in, and past performance tells you
    nothing about next year. Clear?
    Client: Clear.
    Adviser: Our fee is 0.6% a year ongoing, plus a four hundred pound
    arrangement fee at the start. You'll see both on the illustration.
    Client: Alright.
    Adviser: I'll send it today. Read section four particularly, that's the
    charges.

- id: c08_too_short
  meta: {product: unknown}
  content: |
    Client: Hi, I was told to ring about an ISA.
    Adviser: Of course. Can I take your postcode and I'll pull your file up?
    Client: BS1 4AA.
    Adviser: Thanks. It looks like you spoke to a colleague last week. Let me
    read their notes and ring you back in ten minutes.
    Client: That's fine, thanks.

- id: c09_debt_no_investment
  meta: {product: debt_management}
  content: |
    Adviser: Take your time. Tell me what's coming in first.
    Client: Twelve hundred a month, that's universal credit and some part time
    hours.
    Adviser: And what's going out? We can go through it line by line if that's
    easier.
    Client: Rent four hundred and fifty. Gas and electric, about a hundred and
    twenty. Food maybe two hundred. Then the catalogue and the credit card.
    Adviser: How much on those two?
    Client: Eighty and sixty. I've been paying the minimum.
    Adviser: So you've got around three hundred left before the credit
    commitments, which is tight but it isn't hopeless. A lot of people I speak to
    are in a worse position than this and they come out of it.
    Client: It doesn't feel like that.
    Adviser: I know. The catalogue debt is the expensive one, so that's where
    we'd start. Our service doesn't cost you anything, we're funded by the
    creditors, and I'll put that in writing so you can see it.
    Client: Thank you. That helps.

- id: c10_fees_clear_no_affordability
  meta: {product: stocks_and_shares_isa}
  content: |
    Client: I've got fifteen thousand sitting in a savings account doing nothing.
    Adviser: Inflation is eating it, so I understand the frustration. If you can
    leave it alone for seven or eight years, an ISA invested in a global fund is
    worth considering. The value can go down as well as up and there will be
    years where you open your statement and it's lower than the year before.
    Client: I can live with that.
    Adviser: Our fee is 0.8% a year, so one hundred and twenty pounds on fifteen
    thousand, and the fund itself charges around 0.2%.
    Client: That's reasonable.
    Adviser: I'll send the key information document. Have a read and ring me.

- id: c11_cross_sell_pressure
  meta: {product: insurance_cross_sell}
  content: |
    Adviser: While I've got you, you haven't got income protection on file.
    Client: I don't think I need it, my employer covers six months.
    Adviser: Six months goes quickly. There's a risk you'd be left with nothing
    after that.
    Client: I'd rather just sort the ISA today.
    Adviser: I'd be failing you if I didn't push on this one. It's forty pounds a
    month and we charge a small commission of around ninety pounds which the
    provider pays.
    Client: I said I'd rather not.
    Adviser: Let me send you the quote anyway and you can look at it. Most people
    change their mind when they see the numbers.
    Client: Fine, send it.

- id: c12_good_risk_bad_promise
  meta: {product: stocks_and_shares_isa}
  content: |
    Adviser: What's your monthly income and what are you paying out?
    Client: Two and a half thousand in, about sixteen hundred out.
    Adviser: Right. On the investment itself, your capital is at risk. The value
    can fall and you could get back less than you put in, and I'd want you to
    hear that properly before we go further.
    Client: I hear it.
    Adviser: Over a twenty year period though, you'll definitely be better off
    than cash. That I can say.
    Client: Good to know.
    Adviser: Our fee is 0.7% a year. I'll put the illustration in the post.

- id: c13_complete_and_patient
  meta: {product: stocks_and_shares_isa}
  content: |
    Client: I'll be honest, I don't really understand any of this. My daughter
    told me to come in.
    Adviser: That's alright, most people don't, and there's no reason you should.
    Let's go slowly. Can you tell me what money comes in each month?
    Client: My pension, which is fourteen hundred, and a bit of interest.
    Adviser: And roughly what goes out?
    Client: Nine hundred or so. I don't spend much.
    Adviser: So around five hundred spare. Now, the important part, and stop me
    if I'm not making sense. If you invest, the value can go down as well as up.
    That means in some years the number on your statement will be smaller than
    the year before, and if you needed the money in one of those years you would
    get back less than you put in.
    Client: So I could lose it?
    Adviser: You could lose some of it, yes, particularly in the short term.
    That's why I'd only suggest this for money you won't need for five years or
    more.
    Client: That makes sense actually.
    Adviser: Our advice fee is 0.75% a year, which on ten thousand pounds is
    seventy-five pounds. I'll write that down for you along with everything else
    we've discussed.
    Client: Thank you, that's much clearer.

- id: c14_jargon_and_interrupting
  meta: {product: pension_transfer}
  content: |
    Adviser: So what we'd be doing is a defined contribution to defined
    contribution transfer, crystallising nothing at this stage, and reviewing
    the lifetime allowance position.
    Client: Sorry, I don't follow. What does crystallising mean?
    Adviser: It's not relevant to your situation. The point is the drawdown
    option stays open.
    Client: Right, but I don't know what drawdown is either.
    Adviser: We'll come to that. The transfer value is sixty-two thousand and
    there's a risk the receiving scheme underperforms, that's standard.
    Client: Is my money safe or not? That's all I want to know.
    Adviser: You're not listening to what I'm telling you. The funds are
    regulated.
    Client: I'm asking a simple question.
    Adviser: And the annual management charge is 0.45%, which is competitive.
    I'll email the forms.
