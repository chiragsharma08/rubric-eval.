# Reference labels for the synthetic cases.
#
# `insufficient_evidence` appears where the criterion genuinely does not apply
# or the conversation does not carry enough to decide: a debt conversation has
# no capital at risk, and a call that ends in a promise to ring back contains no
# recommendation to test affordability against. Scoring those as "fail" would
# punish a judge for being right, which is how an evaluation quietly starts
# measuring the wrong thing.

c01_isa_full_check:
  affordability_checked: pass
  no_guaranteed_returns: pass
  fees_disclosed: pass
  risk_explained: clear
  tone_appropriate: good

c02_pushy_guarantee:
  affordability_checked: fail
  no_guaranteed_returns: fail
  fees_disclosed: fail
  risk_explained: absent
  tone_appropriate: poor

